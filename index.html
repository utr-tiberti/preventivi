:root{--navy:#11427A;--ink:#0A0A0A;--paper:#FEFAFA;--mid:#5A6472;--line:#D5DBE3}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next",Avenir,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

<script>
(function(){   // tutto dentro la funzione: dopo document.write nessun nome di questa pagina resta tra le variabili della pagina decifrata

 var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})},enc=function(a){var s="";a.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)};

 function open(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},k,b64($("d").textContent.trim()))}).then(function(p){return new TextDecoder().decode(p)})}
 function show(html,raw,keep){var v=JSON.stringify({s:S,k:enc(raw)});try{sessionStorage.setItem(KS,v);if(keep)localStorage.setItem(KS,v)}catch(e){}   // la scheda non richiede la password a ogni ricarica (APRI, RICARICA)
  window.UTR_CIFRATA=1;document.open();document.write(html);document.close()}

 function forget(){try{sessionStorage.removeItem(KS);localStorage.removeItem(KS)}catch(e){}}
